name = "stash-tidal-relay"
main = "src/index.js"
compatibility_date = "2026-10-14"

[vars]
# Tidal's public Android OAuth client used by the selected BitChord implementation.
TIDAL_CLIENT_ID = "fX2JxdmntZWK0ixT"
TIDAL_COUNTRY_CODE = "US"
TIDAL_ACCOUNT_HOURLY_CAP = "60"
TIDAL_ACCOUNT_DAILY_CAP = "1000"

[[d1_databases]]
binding = "DB"
database_name = "stash-tidal-relay"
# Create this database while Wrangler is authenticated to the separate Tidal Cloudflare account,
# then replace this placeholder with the id returned by `wrangler d1 create stash-tidal-relay`.
database_id = "REPLACE_WITH_TIDAL_ACCOUNT_D1_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "REQUEST_RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Required secrets (set in the separate Cloudflare account with `wrangler secret put`):
# ACCESS_TOKEN       Stash app's X-Access-Token value; also signs DASH and init URLs.
# ADMIN_TOKEN        separate, private token for one-time device authorization endpoints.
# TIDAL_CLIENT_SECRET OAuth client secret from the selected community implementation.
